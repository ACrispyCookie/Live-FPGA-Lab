[project]
name = "fpga-demo"
version = "0.1.0"
description = "Platform for running approved FPGA demos from a portfolio page."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
]

[project.scripts]
fpga-agent = "fpga_agent.main:main"
web-api = "web_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
