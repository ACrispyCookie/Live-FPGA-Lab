[project]
name = "fpga-demo-platform"
version = "0.1.0"
description = "Safe job-queue platform for running approved FPGA demos from a portfolio page."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
]

[project.scripts]
fpga-demo = "fpga_demo_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpga_demo_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
